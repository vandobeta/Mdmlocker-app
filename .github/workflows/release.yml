name: Build Android APK and Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: familyguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DBS FamilyGuard EMM - Release ${{ github.ref }}

            ### Android Client APK
            - Built from main branch
            - Requires Android 7.0+ (API 24)
            - Grant Device Admin and Accessibility Service on first launch

            ### Web Dashboard
            - Deployed to Firebase Hosting
            - URL: https://dbfamilyguard.web.app

            ### First Launch
            1. Install APK on target device
            2. Grant Device Admin when prompted
            3. Grant Accessibility Service when prompted
            4. Device registers automatically with Firebase backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
