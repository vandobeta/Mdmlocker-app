name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'firebase-backend/public/**'
      - 'firebase-backend/firebase.json'
      - 'firebase-backend/database.rules.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase-backend/package.json

      - name: Install dependencies
        working-directory: firebase-backend
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: firebase-backend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Output hosting URL
        run: |
          echo "Dashboard deployed to: https://dbfamilyguard.web.app"
          echo "Database URL: https://dbfamilyguard.europe-west1.firebasedatabase.app"
