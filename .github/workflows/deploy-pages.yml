name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firebase-backend/public/**'
      - '.github/pages/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dashboard for GitHub Pages
        run: |
          mkdir -p .github/pages/dist
          cp -r firebase-backend/public/* .github/pages/dist/
          cp -r firebase-backend/public/.* .github/pages/dist/ 2>/dev/null || true
          ls -la .github/pages/dist/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
