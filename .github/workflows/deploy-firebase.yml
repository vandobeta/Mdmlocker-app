name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]
    paths:
      - 'firebase-backend/**'
      - 'app/src/main/java/com/example/viewmodel/MainViewModel.kt'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: firebase-backend/package.json

      - name: Install dependencies
        working-directory: firebase-backend
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: firebase-backend
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive

      - name: Output hosting URL
        run: |
          echo "Firebase Hosting URL: https://${{ github.repository_owner }}.web.app"
          echo "GitHub Pages URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
